  :root {
    --bg1: #ffefe0;
    --bg2: #ffe1ec;
    --bg3: #fff6dc;
    --card: #fffbf2;
    --line: #f2d9c4;
    --ink: #4a3b33;
    --ink-soft: #b79c89;
    --accent: #ff6f81;
    --accent-wash: #ffe3e7;
    --shadow: rgba(120, 70, 60, 0.16);
    --mark: #fff8ee;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #241a1e;
      --bg2: #2b1e28;
      --bg3: #231c14;
      --card: #2b2220;
      --line: #4a382f;
      --ink: #f5e9de;
      --ink-soft: #c2a892;
      --accent: #ff8fa3;
      --accent-wash: #3a2530;
      --shadow: rgba(0, 0, 0, 0.4);
      --mark: #241a1e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #241a1e;
    --bg2: #2b1e28;
    --bg3: #231c14;
    --card: #2b2220;
    --line: #4a382f;
    --ink: #f5e9de;
    --ink-soft: #c2a892;
    --accent: #ff8fa3;
    --accent-wash: #3a2530;
    --shadow: rgba(0, 0, 0, 0.4);
    --mark: #241a1e;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg1: #ffefe0;
    --bg2: #ffe1ec;
    --bg3: #fff6dc;
    --card: #fffbf2;
    --line: #f2d9c4;
    --ink: #4a3b33;
    --ink-soft: #b79c89;
    --accent: #ff6f81;
    --accent-wash: #ffe3e7;
    --shadow: rgba(120, 70, 60, 0.16);
    --mark: #fff8ee;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vw, 48px) 14px 64px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 2px dotted var(--line);
    border-radius: 22px;
    box-shadow: 0 20px 44px -26px var(--shadow), 0 2px 0 var(--line);
    overflow: hidden;
  }

  .card-head {
    position: relative;
    padding: 30px 26px 22px;
    border-bottom: 1px dashed var(--line);
    overflow: hidden;
  }

  .doodle {
    position: absolute;
    pointer-events: none;
  }
  .doodle-flower { top: 10px; left: 14px; width: 26px; height: 26px; fill: #3fbf96; opacity: 0.9; transform: rotate(-8deg); }
  .doodle-star { top: 8px; right: 16px; width: 30px; height: 30px; fill: #ffb238; opacity: 0.95; transform: rotate(14deg); }
  .doodle-spark {
    top: 46px; right: 20px; width: 16px; height: 16px; opacity: 0.85;
  }
  .doodle-spark path { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; }

  .eyebrow {
    margin: 0 0 12px;
    font-family: "LedgerMono", ui-monospace, "Consolas", monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--accent);
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 6vw, 28px);
    line-height: 1.32;
    font-weight: 800;
    text-wrap: balance;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 1;
  }

  h1 .hl {
    position: relative;
    display: inline-block;
  }

  h1 .hl::before {
    content: "";
    position: absolute;
    left: -5px;
    right: -5px;
    bottom: 3px;
    top: 42%;
    background: var(--accent-wash);
    border-radius: 7px;
    transform: rotate(-1.6deg);
    z-index: -1;
  }

  .sub {
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 34ch;
    position: relative;
    z-index: 1;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  .progress-track {
    flex: 1;
    height: 7px;
    border-radius: 999px;
    background: var(--accent-wash);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    width: 10%;
    transition: width 0.35s ease;
  }

  .progress-count {
    font-family: "LedgerMono", ui-monospace, "Consolas", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .progress-count .num { color: var(--ink); }

  .list {
    list-style: none;
    margin: 0;
    padding: 4px 10px;
  }

  .row {
    display: grid;
    grid-template-columns: 30px 1fr 40px;
    align-items: center;
    gap: 12px;
    padding: 13px 6px;
    border-bottom: 1px dashed var(--line);
  }

  .row:last-child { border-bottom: none; }

  .idx {
    font-family: "LedgerMono", ui-monospace, "Consolas", monospace;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    transition: color 0.2s ease;
  }

  .row.done .idx { color: var(--row-stamp, var(--accent)); }

  .text-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
    padding: 4px 2px;
    min-width: 0;
  }

  .text-input::placeholder { color: var(--ink-soft); opacity: 0.8; }

  .text-input:focus {
    outline: none;
    border-bottom-color: var(--row-stamp, var(--accent));
  }

  .row.done .text-input {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
    text-decoration-thickness: 1.5px;
  }

  .stamp {
    justify-self: end;
    position: relative;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: visible;
  }

  .stamp-input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
    z-index: 2;
  }

  .stamp-mark {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    background: transparent;
  }

  .stamp-mark svg {
    width: 14px;
    height: 14px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .stamp-mark svg path {
    fill: none;
    stroke: var(--mark);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .stamp-input:checked + .stamp-mark {
    background: var(--row-stamp, var(--accent));
    border-color: var(--row-stamp, var(--accent));
    transform: scale(1.08);
  }

  .stamp-input:checked + .stamp-mark svg {
    opacity: 1;
    transform: scale(1);
  }

  .stamp-input:focus-visible + .stamp-mark {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .text-input:focus-visible { outline: none; }

  .confetti-bit {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: confetti-pop 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes confetti-pop {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx, 20px)), calc(-50% + var(--dy, 20px))) scale(0.3); opacity: 0; }
  }

  .card-foot {
    padding: 20px 26px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .share-btn {
    width: 100%;
    padding: 13px 20px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--mark);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }

  .share-btn:hover { opacity: 0.92; }
  .share-btn:active { transform: scale(0.98); }
  .share-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .foot-note {
    margin: 0;
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-soft);
    text-align: center;
    max-width: 32ch;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--card);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill, .stamp-mark, .stamp-mark svg, .share-btn, .toast, .confetti-bit {
      transition: none !important;
      animation: none !important;
    }
  }
</style>

<script>
  (function () {
    var STORAGE_KEY = "wishlist20-v1";
    var STAMP_COLORS = ["#ff6f81", "#ffb238", "#3fbf96", "#4fa8d8", "#b07cd9", "#ff9466"];

    var defaults = [
      { text: "카시오 시계", done: true },
      { text: "동대문 비즈가게", done: false }

    while (defaults.length < 20) defaults.push({ text: "", done: false });

    function loadItems() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaults.slice();
        var parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length !== 20) return defaults.slice();
        return parsed.map(function (it) {
          return { text: typeof it.text === "string" ? it.text : "", done: !!it.done };
        });
      } catch (e) {
        return defaults.slice();
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {}
    }

    var items = loadItems();

    var listEl = document.getElementById("list");
    var progressFill = document.getElementById("progressFill");
    var progressCount = document.getElementById("progressCount");
    var toastEl = document.getElementById("toast");
    var toastTimer = null;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function pad2(n) {
      return n < 10 ? "0" + n : String(n);
    }

    function updateProgress() {
      var done = items.filter(function (it) { return it.done; }).length;
      progressFill.style.width = (done / 20) * 100 + "%";
      progressCount.innerHTML =
        '<span class="num">' + done + '</span> / <span class="num">20</span> 완료';
    }

    function burstConfetti(stampEl, color) {
      if (reduceMotion) return;
      var palette = [color, "#ffd166", "#ff6f81", "#3fbf96"];
      for (var k = 0; k < 6; k++) {
        var bit = document.createElement("span");
        bit.className = "confetti-bit";
        var angle = (Math.PI * 2 * k) / 6 + (Math.random() * 0.6 - 0.3);
        var dist = 16 + Math.random() * 10;
        bit.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        bit.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        bit.style.background = palette[k % palette.length];
        stampEl.appendChild(bit);
        (function (el) {
          setTimeout(function () { el.remove(); }, 650);
        })(bit);
      }
    }

    function render() {
      listEl.innerHTML = "";
      items.forEach(function (item, i) {
        var stampColor = STAMP_COLORS[i % STAMP_COLORS.length];

        var li = document.createElement("li");
        li.className = "row" + (item.done ? " done" : "");
        li.style.setProperty("--row-stamp", stampColor);

        var idx = document.createElement("span");
        idx.className = "idx";
        idx.textContent = pad2(i + 1);

        var input = document.createElement("input");
        input.type = "text";
        input.className = "text-input";
        input.placeholder = "하고 싶은 일을 적어보세요";
        input.value = item.text;
        input.setAttribute("aria-label", (i + 1) + "번째 하고 싶은 일");
        input.addEventListener("input", function () {
          items[i].text = input.value;
          saveItems();
        });

        var stampLabel = document.createElement("label");
        stampLabel.className = "stamp";

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "stamp-input";
        checkbox.checked = item.done;
        checkbox.setAttribute("aria-label", (i + 1) + "번째 항목 완료 표시");
        checkbox.addEventListener("change", function () {
          items[i].done = checkbox.checked;
          li.classList.toggle("done", checkbox.checked);
          if (checkbox.checked) burstConfetti(stampLabel, stampColor);
          updateProgress();
          saveItems();
        });

        var mark = document.createElement("span");
        mark.className = "stamp-mark";
        mark.innerHTML =
          '<svg viewBox="0 0 16 16"><path d="M3 8.5 6.3 12 13 4"/></svg>';

        stampLabel.appendChild(checkbox);
        stampLabel.appendChild(mark);

        li.appendChild(idx);
        li.appendChild(input);
        li.appendChild(stampLabel);
        listEl.appendChild(li);
      });
      updateProgress();
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastEl.classList.remove("show");
      }, 2600);
    }

    function buildShareText() {
      var done = items.filter(function (it) { return it.done; }).length;
      var lines = items.map(function (it, i) {
        var mark = it.done ? "[x]" : "[ ]";
        var label = it.text && it.text.trim() ? it.text.trim() : "(미입력)";
        return mark + " " + pad2(i + 1) + ". " + label;
      });
      return "내가 하고 싶은 20가지 (" + done + "/20 완료)\n\n" + lines.join("\n");
    }

    document.getElementById("shareBtn").addEventListener("click", async function () {
      var text = buildShareText();
      if (navigator.share) {
        try {
          await navigator.share({ title: "내가 하고 싶은 20가지", text: text });
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast("복사했어요 — 원하는 곳에 붙여넣기 하세요");
      } catch (e) {
        showToast("공유에 실패했어요. 화면을 캡처해서 보내주세요");
      }
    });

    render();
  })();
</script>
